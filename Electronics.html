<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-pink-50 to-blue-50">
    <section class="max-w-7xl mx-auto px-4 py-8">
       <a href="index.html" class="text-4xl font-bold text-indigo-600">SuperShop</a>

        <section class="max-w-7xl mx-auto px-4 py-8">
  <!-- Heading -->
  <h2 class="text-2xl md:text-4xl font-bold text-gray-900 mb-6">
    Shop By Category
  </h2>

  <!-- Categories Grid -->
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    
    <!-- Card 1 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/air con.jfif" alt="ac">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Air Conditioner
        </span>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/freezers.jfif" alt="">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Freezers/Fridges
        </span>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/hisese party rock.webp" alt="audio">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Audio & Sounds
        </span>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/micro-wave.webp" alt="micro-wave">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Microwaves
        </span>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/wash m.webp" alt="washing-machines">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Washing Machines
        </span>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/shopping tv.webp" alt="television-sets">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          TVs
        </span>
      </div>
    </div>


    <!-- Card 5 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/food p 12.webp" alt="food-processor">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Food Processors & Air Fryers
        </span>
      </div>
    </div>


    <!-- Card 5 -->
    <div class="relative overflow-hidden rounded-lg group cursor-pointer">
      <img src="images/appliances/cooli f.webp" alt="cooling-fans">
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
        <span class="bg-red-500 text-white font-bold px-6 py-2 rounded-full text-sm md:text-lg whitespace-nowrap">
          Cooling Fans
        </span>
      </div>
    </div>


    
  </div>
</section>


 <!-- QUALITY BANNER -->
  <div class="mt-4 rounded-xl overflow-hidden flex flex-col lg:flex-row min-h-[180px] lg:min-h-[220px]">

    <!-- Left Purple Side with slanted edge -->
    <div class="lg:w-[55%] bg-gradient-to-br from-[#8a2a6b] via-[#6b1d53] to-[#1a1a1a] p-6 lg:p-10 flex flex-col justify-center relative"> 
      <h2 class="text-white font-extrabold text-[40px] lg:text-[70px] leading-[0.9] tracking-tight">QUALITY</h2>
      <p class="text-white/90 text-[16px] lg:text-[24px] font-light tracking-wide mt-1">YOU CAN RELY ON</p>
    </div>

    <!-- Right Side with TVs -->
    <div class="lg:w-[45%] bg-[#fd8585] flex items-center justify-center gap-3 lg:gap-6 p-4 lg:p-6 -mt-2 lg:mt-0">
      <div class="bg-black rounded-lg overflow-hidden shadow-lg w-[48%]">
        <img src="images/appliances/smart tv img.jfif" alt="43 Smart TV" class="w-full h-[100px] lg:h-[150px] object-cover">
        <div class="bg-black text-white text-[10px] p-1.5 flex justify-between">
          <span>43" Smart TV</span><span>iTEC</span>
        </div>
      </div>
      <div class="bg-black rounded-lg overflow-hidden shadow-lg w-[48%]">
        <img src="images/appliances/crystal uhd.jfif" alt="Crystal UHD" class="w-full h-[100px] lg:h-[150px] object-cover">
        <div class="bg-black text-white text-[10px] p-1.5 flex justify-between">
          <span>75" crystal UHD TV</span><span>iTEC</span>
        </div>
      </div>
    </div>

  </div>

</div>

    
</body>
</html>
