<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- trends -->
   <a href="index.html" class="text-4xl font-bold text-indigo-600">SuperShop</a>

<!-- Full Page Demo - How it looks in a 4-column Amazon layout (Responsive) -->
<div class="max-w-[1500px] mx-auto mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

  <div class="bg-white rounded-sm shadow-sm p-5">

    </div>
  </div>

  <!-- products for 200 -->
   <div class="bg-white rounded-sm shadow-sm p-5">

        "></div><p class="text-xs mt-1">Women's</p></div>

    </div>
  </div>

  <!-- top Qualities -->
   <div class="bg-white rounded-sm shadow-sm p-5">

 <!-- glow -->
