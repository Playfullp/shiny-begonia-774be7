<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow"><div class="container mx-auto px-4 py-4"><a href="index.html" class="text-2xl font-bold text-indigo-600">ShopHub</a></div></header>
  
  <div id="productDetail" class="container mx-auto px-4 py-8"></div>

  <script>
    const products = [/* same array */]
    const id = new URLSearchParams(window.location.search).get('id')
    const p = products.find(x => x.id == id)
    document.getElementById('productDetail').innerHTML = `
      <div class="grid md:grid-cols-2 gap-8 bg-white p-6 rounded-lg shadow">
        <img src="${p.img}" class="w-full rounded">
        <div>
          <h1 class="text-3xl font-bold mb-2">${p.name}</h1>
          <p class="text-2xl text-indigo-600 font-bold mb-4">$${p.price}</p>
          <p class="mb-4">High quality ${p.cat} with warranty and fast delivery.</p>
          <button onclick="addToCart(${p.id})" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700">Add to Cart</button>
        </div>
      </div>`
    
    function addToCart(id){
      let cart = JSON.parse(localStorage.getItem('cart')||'[]')
      cart.push(id)
      localStorage.setItem('cart', JSON.stringify(cart))
      alert('Added to cart')
    }
  </script>
</body>
</html>
