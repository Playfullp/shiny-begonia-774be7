<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow"><div class="container mx-auto px-4 py-4"><a href="index.html" class="text-2xl font-bold text-indigo-600">ShopHub</a></div></header>
  
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Your Cart</h1>
    <div id="cartItems" class="bg-white p-6 rounded-lg shadow mb-4"></div>
    <a href="checkout.html" class="bg-indigo-600 text-white px-6 py-3 rounded-lg">Proceed to Checkout</a>
  </div>

  <script>
    const products = [/* same array */]
    const cart = JSON.parse(localStorage.getItem('cart')||'[]')
    const items = cart.map(id => products.find(p => p.id == id))
    const total = items.reduce((sum,p) => sum + p.price, 0)
    document.getElementById('cartItems').innerHTML = items.length ? 
      items.map(p => `<div class="flex justify-between py-2 border-b">${p.name} <span>$${p.price}</span></div>`).join('') + `<div class="font-bold pt-4">Total: $${total}</div>`
      : 'Your cart is empty'
  </script>
</body>
</html>
